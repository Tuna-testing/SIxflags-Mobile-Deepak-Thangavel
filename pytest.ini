[pytest]
pythonpath = .
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*

addopts = -v -n 2 --html=reports/report.html --self-contained-html --show-capture=no
initial_sort = order

markers =
    android: mark test as Android
    ios: mark test as iOS

    framework: Framework infrastructure validation tests
    health_check: Local setup, device, Appium, and driver health checks

    sanity: Build validation sanity suite
    smoke: Smoke test suite
    regression: Regression suite

    app_launch: App launch and initial landing state tests
    auth: Authentication related tests
    login: Login journey tests
    session: Guest/logged-in session setup and switching tests

    guest: Guest user flow tests
    logged_in: Logged-in user flow tests

    home: Home screen tests
    explore: Explore screen tests
    wallet: Wallet tests
    shop: Shop screen tests
    more: More screen tests
    park: Park selection and park context tests

    api: API validation tests
    api_ui: API + UI validation tests
    content_api: Content API validation tests
    fims_api: FIMS API validation tests

    fresh_install: Tests requiring fresh install or first launch state
    existing_install: Tests using already installed app state
    in_park: Inside-park scenarios
    outside_park: Outside-park scenarios
    location_mock: Tests requiring manual or automated location mocking

    critical: Product critical tests
    high: High priority tests
    medium: Medium priority tests
    low: Low priority tests

    test_case(id, title, description, report_order): QA/manual test case metadata shown in report. report_order is optional.
    state_plan(required, final, transition, special=False): Declarative mobile test state metadata. Allowed required/final values: guest, logged_in, any. Allowed transitions: none, login, logout, launch.
